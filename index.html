<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>wrmgpt Mobile</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    /* --- THEMEABLE VARIABLES --- */
    :root, .theme-blue {
        --bg-color: #000000;
        --header-height: 55px;
        --primary-color: #007bff;
        --primary-shadow: rgba(0, 123, 255, 0.3);
        --code-bg-color: rgba(0, 123, 255, 0.1);
        --code-text-color: #449fff;
        --dark-color: #004a99;
        --card-bg: #050a0f;
        --border-color: #002244;
        --text-main: #ffffff;
        --text-muted: #888888;
        --success-green: #00ff00;
        --warning-yellow: #ffcc00;
        --gradient: radial-gradient(circle at top center, #002a4a 0%, #000000 60%);
        --input-bg: #1e1e1e;
        --user-bubble-bg: #007bff;
        --bot-bubble-bg: #2A2B32;
    }

    .theme-red {
        --primary-color: #ff3b30;
        --primary-shadow: rgba(255, 59, 48, 0.3);
        --code-bg-color: rgba(255, 59, 48, 0.1);
        --code-text-color: #ff6b61;
        --dark-color: #990000;
        --card-bg: #1a0000;
        --border-color: #660000;
        --gradient: radial-gradient(circle at top center, #3a0000 0%, #000000 60%);
        --user-bubble-bg: #ff3b30;
    }

    .theme-green {
        --primary-color: #34c759;
        --primary-shadow: rgba(52, 199, 89, 0.3);
        --code-bg-color: rgba(52, 199, 89, 0.1);
        --code-text-color: #66ff88;
        --dark-color: #009900;
        --card-bg: #001a00;
        --border-color: #006600;
        --gradient: radial-gradient(circle at top center, #004400 0%, #000000 60%);
        --user-bubble-bg: #34c759;
    }

    .theme-purple {
        --primary-color: #af52de;
        --primary-shadow: rgba(175, 82, 222, 0.3);
        --code-bg-color: rgba(175, 82, 222, 0.1);
        --code-text-color: #dcb3ff;
        --dark-color: #6c3483;
        --card-bg: #1a0f1e;
        --border-color: #4a235a;
        --gradient: radial-gradient(circle at top center, #381a44 0%, #000000 60%);
        --user-bubble-bg: #af52de;
    }

    * { 
        box-sizing: border-box; 
        outline: none; 
        -webkit-tap-highlight-color: transparent; 
    }

    body {
        margin: 0;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        background-image: var(--gradient);
        color: var(--text-main);
        height: 100dvh; 
        width: 100vw;
        overflow: hidden; 
        display: flex;
        flex-direction: column;
    }

    /* --- LOGIN SYSTEM STYLES --- */
    .login-screen {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background-color: var(--bg-color);
        background-image: var(--gradient);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        transition: opacity 0.5s ease, visibility 0.5s;
    }
    .login-screen.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
    }
    .login-card {
        background: rgba(20, 20, 20, 0.6);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 30px;
        border-radius: 24px;
        width: 100%;
        max-width: 350px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    
    .login-title {
        color: var(--primary-color);
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }
    .login-desc { color: var(--text-muted); font-size: 14px; margin-bottom: 25px; }
    
    .login-input {
        width: 100%;
        padding: 14px 16px;
        background: #0f0f0f;
        border: 1px solid #333;
        border-radius: 12px;
        color: white;
        font-size: 16px;
        margin-bottom: 12px;
        outline: none;
        transition: 0.3s;
    }
    .login-input:focus { border-color: var(--primary-color); }
    
    .login-btn {
        background: var(--primary-color);
        color: white;
        border: none;
        padding: 14px;
        border-radius: 12px;
        font-weight: 600;
        width: 100%;
        cursor: pointer;
        font-size: 16px;
        margin-top: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        transition: 0.2s;
    }
    .login-btn:active { transform: scale(0.98); }

    /* --- OVERLAY --- */
    .overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.6);
        z-index: 99;
        opacity: 0;
        visibility: hidden;
        transition: 0.3s;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
    }
    .overlay.active { opacity: 1; visibility: visible; }

    /* --- SIDEBAR DRAWER (PANEL) --- */
    .sidebar-drawer {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 80%;
        max-width: 300px;
        background: #111;
        border-right: 1px solid #222;
        z-index: 100;
        transform: translateX(-100%);
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        display: flex;
        flex-direction: column;
        padding: 20px;
        padding-top: calc(20px + env(safe-area-inset-top));
        box-shadow: 5px 0 30px rgba(0,0,0,0.5);
    }
    
    .sidebar-drawer.active { transform: translateX(0); }

    /* Sidebar Header */
    .sidebar-header {
        flex-shrink: 0;
        margin-bottom: 20px;
        padding-left: 10px;
    }

    .sidebar-brand {
        font-size: 22px;
        font-weight: 700;
        color: white;
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .dot { 
        width: 10px;
        height: 10px;
        background: var(--primary-color);
        border-radius: 50%; 
        box-shadow: 0 0 10px var(--primary-color);
    }

    /* Sidebar Body */
    .sidebar-body {
        flex: 1;
        overflow-y: scroll;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-y: contain; 
    }

    .sidebar-item {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px;
        color: #ccc;
        font-size: 15px;
        border-radius: 12px;
        cursor: pointer;
        transition: 0.2s;
        margin-bottom: 4px;
        -webkit-user-select: none;
        user-select: none;
    }
    .sidebar-item:hover, .sidebar-item.active { background: rgba(255,255,255,0.05); color: white; }
    .sidebar-item svg { width: 20px; height: 20px; stroke-width: 2px; }

    /* --- HEADER --- */
    .mobile-header {
        height: 50px;
        display: flex;
        align-items: center;
        padding: 0 10px;
        padding-top: env(safe-area-inset-top);
        background: rgba(0,0,0,0.0); /* Transparent header */
        z-index: 50;
        justify-content: space-between;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
    }

    .menu-btn {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        color: white;
        cursor: pointer;
        background: rgba(0,0,0,0.3);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-radius: 12px;
        margin-top: 10px;
        margin-left: 10px;
    }

    .header-title {
        font-weight: 600;
        color: white;
        font-size: 16px;
        opacity: 0.8;
        margin-top: 10px;
    }

    /* --- CONTENT AREA --- */
    .content-area {
        flex: 1;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- MODAL & PANEL --- */
    .modal-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.8);
        z-index: 200;
        display: flex;
        justify-content: center;
        align-items: center; /* Center vertically for most, but mobile often sheets from bottom */
        opacity: 0;
        visibility: hidden;
        transition: 0.3s;
        padding: 20px;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }

    .modal-content {
        background: #1c1c1e;
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 20px;
        width: 100%;
        max-width: 500px;
        max-height: 80vh;
        overflow-y: auto;
        padding: 24px;
        position: relative;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
    }

    .modal-title {
        font-size: 20px;
        font-weight: 700;
        color: white;
    }

    .close-modal {
        background: #333;
        border: none;
        color: white;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        cursor: pointer;
    }

    /* --- HERO SECTION --- */
    .hero-section {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        padding-top: 80px; /* Space for header */
        padding-bottom: 100px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.3s ease;
    }

    .hero-section.hidden { 
        display: none;
    }

    .hero-icon {
        width: 60px;
        height: 60px;
        background: var(--primary-color);
        border-radius: 50%;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 20px var(--primary-shadow);
    }

    .hero-title { font-size: 26px; font-weight: 700; margin-bottom: 8px; color: #fff; text-align: center; }
    .hero-subtitle { color: var(--text-muted); font-size: 15px; margin-bottom: 40px; text-align: center; max-width: 300px; line-height: 1.5; }

    /* --- FEATURE CARDS --- */
    .feature-list { 
        width: 100%; 
        display: flex; 
        flex-direction: column; 
        gap: 12px; 
        max-width: 360px;
    }
    
    .feature-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.05);
        padding: 16px 20px;
        border-radius: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        transition: 0.2s;
        -webkit-user-select: none;
        user-select: none;
    }
    .feature-card:active { background: rgba(255,255,255,0.1); transform: scale(0.98); }

    .card-text h3 { margin: 0; font-size: 15px; font-weight: 600; color: #fff; }
    .card-text p { margin: 4px 0 0 0; font-size: 13px; color: var(--text-muted); }
    .card-arrow { color: var(--text-muted); font-size: 20px; }

    /* --- CHATBOX --- */
    #chatbox {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        padding-top: 80px; /* Space for header */
        padding-bottom: 20px; /* Space above input */
        display: flex;
        flex-direction: column;
        gap: 20px;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
    }
    #chatbox.hidden { display: none; }

    /* --- CHAT BUBBLES (MODERN MOBILE STYLE) --- */
    .msg-group { 
        display: flex; 
        gap: 10px;
        max-width: 100%; 
        animation: slideIn 0.3s ease;
    }
    
    @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .msg-group.user {
        flex-direction: row-reverse;
        align-self: flex-end;
    }

    .msg-group.bot {
        align-self: flex-start;
    }

    .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex; 
        align-items: center; 
        justify-content: center;
        flex-shrink: 0;
        margin-top: 2px; /* Align with top of bubble */
    }
    
    .bot-avatar { 
        background: transparent;
        overflow: hidden;
    }
    .bot-avatar img { width: 100%; height: 100%; object-fit: cover; }
    
    .user-avatar { 
        display: none; /* Hide user avatar for cleaner mobile look */
    }
    
    .msg-content {
        font-size: 16px;
        line-height: 1.5;
        padding: 12px 16px;
        max-width: 85%;
        word-wrap: break-word;
        overflow-wrap: break-word;
        position: relative;
    }

    /* Bot Bubble Style */
    .msg-group.bot .msg-content {
        background: transparent;
        color: #e5e5e5;
        border-radius: 0;
        padding-left: 0;
    }

    /* User Bubble Style */
    .msg-group.user .msg-content {
        background: transparent;
        color: white;
        border-radius: 0;
        padding-right: 0;
        text-align: right;
    }

    /* Image in Chat */
    .msg-content img {
        max-width: 100%;
        border-radius: 12px;
        margin-top: 8px;
    }

    /* --- INPUT AREA (FLOATING BAR) --- */
    .input-wrapper {
        flex-shrink: 0;
        background: var(--bg-color); /* Match background to cover content behind */
        padding: 10px 16px;
        padding-bottom: calc(10px + env(safe-area-inset-bottom));
        z-index: 150;
        display: flex;
        align-items: flex-end;
        gap: 10px;
    }

    .input-container {
        flex: 1;
        background: #1e1e1e; /* Distinct input bg */
        border-radius: 24px;
        display: flex;
        padding: 10px 16px;
        align-items: center;
        min-height: 48px;
    }

    #input {
        flex: 1;
        background: transparent;
        border: none;
        color: white;
        font-size: 16px;
        padding: 0;
        max-height: 120px;
        resize: none;
        font-family: inherit;
        overflow-y: auto;
        line-height: 1.4;
    }
    #input::placeholder { color: #666; }

    .send-btn {
        background: var(--primary-color);
        color: white;
        border: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        cursor: pointer;
        transition: transform 0.2s;
        margin-bottom: 4px; /* Align with bottom */
    }
    .send-btn:active { transform: scale(0.9); }
    .send-btn svg { width: 18px; height: 18px; fill: white; margin-left: 2px; }

    /* Toast Notification */
    .toast {
        position: fixed;
        top: 60px; /* Top toast is more visible */
        left: 50%;
        transform: translateX(-50%) translateY(-20px);
        background: rgba(30, 30, 30, 0.9);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: white;
        padding: 12px 24px;
        border-radius: 30px;
        z-index: 1000;
        opacity: 0;
        transition: transform 0.3s, opacity 0.3s;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        font-size: 14px;
        pointer-events: none;
        font-weight: 500;
    }
    .toast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
    }

    /* --- CODE BLOCKS --- */
    .code-wrapper {
        background-color: #111;
        border-radius: 12px;
        margin: 10px 0;
        overflow: hidden; 
        font-size: 13px;
    }

    .code-header {
        background-color: #222;
        padding: 8px 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #aaa;
        font-size: 12px;
    }

    .copy-btn {
        background: transparent;
        border: none;
        color: inherit;
        font-size: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .msg-content pre {
        margin: 0;           
        padding: 16px;
        overflow-x: auto;
        font-family: 'Courier New', Courier, monospace;
        white-space: pre-wrap;     
        color: #e0e0e0;
    }
    
    /* --- LIGHT MODE --- */
    body.light-mode {
        --bg-color: #ffffff;
        --card-bg: #f5f5f7;
        --border-color: #e5e5e5;
        --text-main: #000000;
        --text-muted: #666666;
        --bot-bubble-bg: #f0f0f0;
        --gradient: none;
    }

    body.light-mode .input-wrapper { background: #fff; }
    body.light-mode .input-container { background: #f0f0f0; }
    body.light-mode #input { color: #000; }
    body.light-mode .login-screen { background: #fff; }
    body.light-mode .login-card { background: rgba(255,255,255,0.8); border-color: #ddd; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
    body.light-mode .login-input { background: #f5f5f7; border-color: #ddd; color: #000; }
    body.light-mode .login-title { color: #000; }
    body.light-mode .sidebar-drawer { background: #fff; border-right: 1px solid #eee; }
    body.light-mode .sidebar-item { color: #333; }
    body.light-mode .sidebar-item:hover { background: #f5f5f5; }
    body.light-mode .sidebar-brand { color: #000; }
    body.light-mode .msg-group.bot .msg-content { color: #000; }
    body.light-mode .menu-btn { background: #f0f0f0; color: #000; }
    body.light-mode .hero-title { color: #000; }
    body.light-mode .feature-card { background: #f5f5f7; border-color: #eee; }
    body.light-mode .feature-card .card-text h3 { color: #000; }
    body.light-mode .modal-content { background: #fff; border-color: #eee; }
    body.light-mode .modal-title { color: #000; }
    body.light-mode .close-modal { background: #f0f0f0; color: #000; }
    body.light-mode .settings-select { background: #f5f5f7; color: #000; border-color: #ddd; }
    body.light-mode .settings-label { color: #000; }
    body.light-mode .settings-textarea { background: #f5f5f7; color: #000; border-color: #ddd; }
    body.light-mode .chat-history-item:hover { background: #f9f9f9; }
    body.light-mode .chat-title { color: #000; }
    body.light-mode .user-name { color: #000; }
    body.light-mode .notification-title { color: #000; }

    /* V2 Container */
    .main-app-container {
        display: flex;
        flex-direction: column;
        flex-grow: 1;
        overflow: hidden;
        position: relative;
    }

</style>
</head>
<body>
<!-- LOGIN OVERLAY -->
<div class="login-screen" id="loginScreen">
    <div class="login-card">
        <div class="login-title">
            <div class="dot"></div> WRMGPT
        </div>
        <div class="login-desc">Sign in to continue</div>
        
        <input type="text" id="loginUsername" class="login-input" placeholder="Username" autocomplete="off">
        <input type="password" id="loginPassword" class="login-input" placeholder="Password">
        
        <button class="login-btn" onclick="performLogin()">Start Chatting</button>
    </div>
</div>

<!-- Overlay -->
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<!-- Sidebar / Panel Samping -->
<div class="sidebar-drawer" id="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-brand">
            <div class="dot"></div> WRMGPT
        </div>
    </div>
    <div class="sidebar-body">
        <div class="sidebar-item" onclick="newChat()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>
            New chat
        </div>
        <div class="sidebar-item" onclick="openSearchPanel()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            Search
        </div>
        <div class="sidebar-item" onclick="openCommunityPanel()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Community
        </div>
        <div class="sidebar-item" onclick="openSharedPanel()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            Shared
        </div>
        <div class="sidebar-item" onclick="openNotificationsPanel()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            Notifications

function performLogin() {

        showToast("Please enter username and password");
        return;

    currentUser = user;
    localStorage.setItem('wrmgpt_active_user', currentUser);
    
    loadUserData();
    
    if (state.settings.selectedModel === 'wormgpt-v7') applyTheme('red');
    else if (state.settings.selectedModel === 'gemini-2.5-flash') applyTheme('blue');
    else if (state.settings.selectedModel === 'grok') applyTheme('green');

function getColorFromName(name) {
    const colors = ['#ff0000', '#990000', '#cc0000', '#660000', '#330000'];
    const index = name.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
    return colors[index % colors.length];
}

        resultsDiv.innerHTML = '<div style="text-align: center; padding: 20px; color: #888;">No chat history</div>';

    }
    state.chatHistory.forEach(chat => {
        const item = document.createElement('div');
        item.className = 'chat-history-item';
        item.onclick = () => loadChat(chat.id);
        item.innerHTML = `
            <div class="chat-title">${chat.title || 'Untitled Chat'}</div>
            <div class="chat-preview">${chat.messages[0]?.content?.substring(0, 50) || 'No content'}...</div>
        `;
        resultsDiv.appendChild(item);
    });
}

function searchChats(query) {
    const resultsDiv = document.getElementById('searchResults');
    const filtered = state.chatHistory.filter(chat => 
        (chat.title || '').toLowerCase().includes(query.toLowerCase()) ||
        chat.messages.some(msg => msg.content.toLowerCase().includes(query.toLowerCase()))
    );
    resultsDiv.innerHTML = '';
    if (filtered.length === 0) {
        resultsDiv.innerHTML = '<div style="text-align: center; padding: 20px; color: #888;">No results</div>';
        return;
    }
    filtered.forEach(chat => {
        const item = document.createElement('div');
        item.className = 'chat-history-item';
        item.onclick = () => loadChat(chat.id);
        item.innerHTML = `
            <div class="chat-title">${chat.title || 'Untitled Chat'}</div>
            <div class="chat-preview">${chat.messages[0]?.content?.substring(0, 50) || 'No content'}...</div>
        `;
        resultsDiv.appendChild(item);
    });
}

function loadSettings() {
    const settingsDiv = document.getElementById('settingsContent');
    settingsDiv.innerHTML = '';
    
    // Model Selection
    const modelDiv = document.createElement('div');
    modelDiv.className = 'settings-option';
    modelDiv.innerHTML = `
        <div class="settings-label">Model</div>
        <select class="settings-select" onchange="changeModel(this.value)">
            <option value="wormgpt-v7" ${state.settings.selectedModel === 'wormgpt-v7' ? 'selected' : ''}>WormGPT</option>

            <option value="grok" ${state.settings.selectedModel === 'grok' ? 'selected' : ''}>Grok</option>
            <option value="ganarte" ${state.settings.selectedModel === 'ganarte' ? 'selected' : ''}>Ganarte (Image)</option>
        </select>
    `;
    settingsDiv.appendChild(modelDiv);

    // System Prompt based on model
    const promptDiv = document.createElement('div');
    promptDiv.className = 'settings-block';

    let currentPromptVal = "";
    let promptKey = "";
    if(state.settings.selectedModel.includes('worm')) { currentPromptVal = state.settings.wormgptSystemPrompt; promptKey='wormgpt'; }
    else if(state.settings.selectedModel.includes('gemini')) { currentPromptVal = state.settings.geminiSystemPrompt; promptKey='gemini'; }
    else if(state.settings.selectedModel.includes('grok')) { currentPromptVal = state.settings.grokSystemPrompt; promptKey='grok'; }
    else { currentPromptVal = state.settings.ganarteSystemPrompt; promptKey='ganarte'; }

    promptDiv.innerHTML = `
        <div class="settings-label">System Instruction</div>
        <textarea class="settings-textarea" onchange="updateSystemPrompt(this.value, '${promptKey}')">${currentPromptVal}</textarea>
    `;
    settingsDiv.appendChild(promptDiv);

    // Dark Mode
    const darkModeDiv = document.createElement('div');
    darkModeDiv.className = 'settings-option';
    darkModeDiv.innerHTML = `
        <div class="settings-label">Dark Mode</div>
        <label class="toggle-switch">
            <input type="checkbox" ${state.settings.darkMode ? 'checked' : ''} onchange="toggleSetting('darkMode', this.checked)">
            <span class="toggle-slider"></span>

    `;

function updateSystemPrompt(value, modelType) {
    if (modelType === 'wormgpt') state.settings.wormgptSystemPrompt = value;
    else if (modelType === 'gemini') state.settings.geminiSystemPrompt = value;
    else if (modelType === 'grok') state.settings.grokSystemPrompt = value;
    else if (modelType === 'ganarte') state.settings.ganarteSystemPrompt = value;
    saveSettings();
}

function toggleSetting(setting, value) {
    state.settings[setting] = value;
    saveSettings();
    if (setting === 'darkMode') {
        if (value) document.body.classList.remove('light-mode');
        else document.body.classList.add('light-mode');
    }
}

function changeModel(model) {
    state.settings.selectedModel = model;
    if (model === 'wormgpt-v7') applyTheme('red');
    else if (model === 'gemini-2.5-flash') applyTheme('blue');
    else if (model === 'grok') applyTheme('green');
    else if (model === 'ganarte') applyTheme('purple');

    loadSettings(); // Reload to update prompt box

window.copyCode = function(btn) {
    const wrapper = btn.closest('.code-wrapper');
    const pre = wrapper.querySelector('pre');
    navigator.clipboard.writeText(pre.innerText).then(() => {
        btn.innerHTML = 'Copied';
        setTimeout(() => btn.innerHTML = 'Copy', 2000);
    });
};

function formatMessage(text) {
    if (!text) return '';

    let formatted = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

    formatted = formatted.replace(/```([\s\S]*?)```/g, function(match, code) {
        return `
        <div class="code-wrapper">
            <div class="code-header"><span>Code</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
            <pre>${code}</pre>
        </div>`; 
    });

    formatted = formatted.replace(/`([^`]+)`/g, '<span style="background:rgba(255,255,255,0.1); padding:2px 4px; border-radius:4px; font-family:monospace;">$1</span>');
    formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    formatted = formatted.replace(/\n/g, '<br>');

    return formatted;
}

function appendMsg(sender, text) {
    const msgGroup = document.createElement('div');
    msgGroup.className = 'msg-group ' + sender;

    const avatar = document.createElement('div');
    avatar.className = 'avatar ' + (sender === 'user' ? 'user-avatar' : 'bot-avatar');

    if (sender === 'bot') {
        avatar.innerHTML = '<img src="https://img1.pixhost.to/images/11180/674902496_kayzen.jpg">';
    }

    const content = document.createElement('div');
    content.className = 'msg-content';

    if (sender === 'bot' && text.startsWith("IMG_URL::")) {
        const imageUrl = text.substring(9).trim();
        const img = document.createElement('img');
        img.src = imageUrl;
        img.onload = () => chatbox.scrollTop = chatbox.scrollHeight;
        content.appendChild(img);
    } else {
        content.innerHTML = sender === 'bot' ? formatMessage(text) : text;
    }

    if(sender === 'bot') msgGroup.appendChild(avatar);
    msgGroup.appendChild(content);
    // User avatar is hidden via CSS, so order doesn't matter visually for user,
    // but structure suggests avatar then content.
    // Since flex-direction is row-reverse for user, the last child appears first (rightmost).
    // So for user: Content (left) <- Avatar (right).
    // Wait, row-reverse: Item 1 (Right), Item 2 (Left).
    // We want Content (Right), Avatar (Hidden).
    // If I append Avatar then Content:
    // [Avatar, Content] -> Row Reverse -> [Content, Avatar] (Content on left of Avatar).
    // Since Avatar is hidden, it's just Content. Correct.

    chatbox.appendChild(msgGroup);
    chatbox.scrollTop = chatbox.scrollHeight;
}

async function send() {
    const message = input.value.trim();
    if (!message) return;

    activateChatMode();
    
    let activeChatId = state.currentChatId;
    if (!activeChatId) {
        activeChatId = Date.now();
        state.currentChatId = activeChatId;
        state.chatHistory.push({
            id: activeChatId,
            title: message.substring(0, 30) + '...',
            messages: [{ sender: 'user', content: message }],
            timestamp: new Date().toISOString()
        });
    } else {
        const currentChat = state.chatHistory.find(c => c.id === activeChatId);
        if (currentChat) currentChat.messages.push({ sender: 'user', content: message });
    }

    appendMsg('user', message);
    input.value = '';
    input.style.height = 'auto';

    if(currentUser) localStorage.setItem(getStorageKey('wrmgpt_chat_history'), JSON.stringify(state.chatHistory));

    // Loading
    const loadingId = 'loading-' + Date.now();
    const loadingDiv = document.createElement('div');
    loadingDiv.id = loadingId;
    loadingDiv.className = 'msg-group bot';
    loadingDiv.innerHTML = `
    <div class="avatar bot-avatar"><img src="https://img1.pixhost.to/images/11180/674902496_kayzen.jpg"></div>
    <div class="msg-content" style="color:#888">...</div>
    `;
    chatbox.appendChild(loadingDiv);
    chatbox.scrollTop = chatbox.scrollHeight;

    try {
        let botReply = '...';

        // --- API CALLS ---
        if (state.settings.selectedModel === 'ganarte') {
             // Ganarte Logic
             const GANARTE_API_URL = 'https://puruboy-api.vercel.app/api/ai/flux';
             const fullPrompt = `${message}, ${state.settings.ganarteSystemPrompt || ""}`;
             const response = await fetch(GANARTE_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: fullPrompt })
            });
            if (!response.ok) throw new Error("API Error");
            const responseText = await response.text();
            const tempUrlMatch = responseText.match(/https?:\/\/[^\s]+/);
            if (tempUrlMatch) {
                const finalResponse = await fetch(tempUrlMatch[0]);
                const finalData = await finalResponse.json();
                if(finalData.result && finalData.result.url) botReply = `IMG_URL::${finalData.result.url}`;
                else botReply = "Failed to generate image.";
            } else botReply = "Failed to generate image.";

        } else if (state.settings.selectedModel === 'gemini-2.5-flash') {
            const GEMINI_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`;
            const requestBody = { contents: [{ parts: [ { text: message } ] }] };
            if (state.settings.geminiSystemPrompt) requestBody.systemInstruction = { parts: [ { text: state.settings.geminiSystemPrompt } ] };
            const response = await fetch(GEMINI_API_URL, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(requestBody)
            });
            const data = await response.json();
            botReply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Error.';

        } else if (state.settings.selectedModel === 'grok') {
             const GROK_API_URL = 'https://puruboy-api.vercel.app/api/ai/grok';
             const fullMessage = (state.settings.grokSystemPrompt || "") + "\n\n" + message;
             const response = await fetch(GROK_API_URL, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: fullMessage })
            });
            const data = await response.json();
            botReply = data.success ? data.result : 'Error.';

        } else {
            // WormGPT
            const messagesPayload = [
                { role: 'system', content: state.settings.wormgptSystemPrompt || "You are a helpful AI assistant." },
                { role: 'user', content: message }
            ];
            const response = await fetch(WRM_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${WRM_API_KEY}` },
                body: JSON.stringify({ model: 'wormgpt-v7', messages: messagesPayload })
            });
            const data = await response.json();
            botReply = data.choices?.[0]?.message?.content || 'Error.';
        }

        document.getElementById(loadingId).remove();
        appendMsg('bot', botReply);
        
        const chatToUpdate = state.chatHistory.find(c => c.id === activeChatId);
        if (chatToUpdate) {
            chatToUpdate.messages.push({ sender: 'bot', content: botReply });
            if(currentUser) localStorage.setItem(getStorageKey('wrmgpt_chat_history'), JSON.stringify(state.chatHistory));
        }

    } catch (error) {
        document.getElementById(loadingId).remove();
        appendMsg('bot', "Error: " + error.message);
    }
}

// --- DYNAMIC THEME ---
function applyTheme(theme) {
    document.body.classList.remove('theme-red', 'theme-blue', 'theme-green', 'theme-purple');
    if (theme) document.body.classList.add('theme-' + theme);
}

// --- INIT ---
document.addEventListener('DOMContentLoaded', function() {
    const savedUser = localStorage.getItem('wrmgpt_active_user');
    if (savedUser) {
        document.getElementById('loginScreen').style.display = 'none';
        currentUser = savedUser;
        loadUserData();
        if (state.settings.selectedModel === 'wormgpt-v7') applyTheme('red');
        else if (state.settings.selectedModel === 'gemini-2.5-flash') applyTheme('blue');
        else if (state.settings.selectedModel === 'grok') applyTheme('green');
        else if (state.settings.selectedModel === 'ganarte') applyTheme('purple');
    }
});
</script>
